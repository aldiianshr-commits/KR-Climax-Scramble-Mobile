name: Build APK

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
  workflow_dispatch:
    inputs:
      turnip_url:
        description: "Optional: direct URL of a Turnip adrenotools .zip to bundle"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 3G
      CCACHE_COMPILERCHECK: content
      CCACHE_SLOPPINESS: time_macros,include_file_mtime,include_file_ctime
      NDK_VERSION: 28.2.13676358
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/node_modules /opt/ghc /usr/local/.ghcup \
                      /usr/share/swift /usr/local/share/powershell /usr/local/share/chromium || true
          df -h /

      - uses: actions/checkout@v4

      - name: Read pins
        id: pins
        run: |
          set -a; . ./eden.lock; set +a
          echo "eden_repo=$EDEN_REPO" >> "$GITHUB_OUTPUT"
          echo "eden_ref=$EDEN_REF" >> "$GITHUB_OUTPUT"
          echo "eden_commit=$EDEN_COMMIT" >> "$GITHUB_OUTPUT"
          V=$(tr -d ' \n' < VERSION)
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "tag=v$V" >> "$GITHUB_OUTPUT"

      - name: Fetch Eden core (pinned)
        run: |
          git init -q eden
          cd eden
          git remote add origin "${{ steps.pins.outputs.eden_repo }}"
          git fetch -q --depth 1 origin "${{ steps.pins.outputs.eden_commit }}"
          git checkout -q FETCH_HEAD
          git log -1 --oneline

      - name: Apply KR Climax Scramble layer
        run: python3 scripts/apply_overlay.py eden

      - name: Bundle Turnip driver
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TURNIP_URL: ${{ github.event.inputs.turnip_url }}
        run: |
          mkdir -p ci-logs
          python3 scripts/fetch_turnip.py eden/src/android/app/src/main/assets/kr_drivers 2>&1 | tee ci-logs/turnip.log
          ls -la eden/src/android/app/src/main/assets/kr_drivers || true
          cat eden/src/android/app/src/main/assets/kr_drivers/SOURCE.txt || true

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK components
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" --install "ndk;${NDK_VERSION}" "cmake;3.22.1" "platforms;android-36" "build-tools;36.0.0" > /dev/null
          ls "$ANDROID_HOME/ndk"

      - name: Install ccache / ninja
        run: sudo apt-get update -q && sudo apt-get install -y -q ccache ninja-build glslang-tools

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: |
            .ccache
            eden/.cache
          key: ccache-${{ steps.pins.outputs.eden_commit }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ steps.pins.outputs.eden_commit }}-

      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('eden/src/android/**/*.kts') }}
          restore-keys: gradle-

      - name: Gradle settings
        run: |
          echo "" >> eden/src/android/gradle.properties
          cat >> eden/src/android/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
          EOF

      - name: Compile Kotlin first (fast feedback)
        working-directory: eden/src/android
        env:
          GIT_TAG_NAME: ${{ steps.pins.outputs.version }}
        run: |
          chmod +x ./gradlew
          set -o pipefail
          ./gradlew --no-daemon :app:compileMainlineReleaseKotlin 2>&1 | tee "$GITHUB_WORKSPACE/ci-logs/kotlin.log"

      - name: Build APK (native core + app)
        working-directory: eden/src/android
        env:
          GIT_TAG_NAME: ${{ steps.pins.outputs.version }}
        run: |
          set -o pipefail
          ./gradlew --no-daemon assembleMainlineRelease \
            -PYUZU_ANDROID_ARGS="-DUSE_CCACHE=ON" \
            -Dorg.gradle.workers.max=4 2>&1 | tee "$GITHUB_WORKSPACE/ci-logs/build.log"
          ccache -s || true

      - name: Collect APK
        id: apk
        run: |
          APK=$(find eden/src/android/app/build/outputs/apk -name '*mainline*release*.apk' | head -1)
          test -n "$APK"
          mkdir -p dist
          OUT="dist/KR-Climax-Scramble-${{ steps.pins.outputs.version }}-arm64.apk"
          cp "$APK" "$OUT"
          sha256sum "$OUT" | tee "$OUT.sha256"
          echo "path=$OUT" >> "$GITHUB_OUTPUT"
          {
            "$ANDROID_HOME/build-tools/36.0.0/aapt2" dump badging "$OUT" | head -8
            unzip -l "$OUT" | grep -E "lib/arm64-v8a|assets/kr_drivers|classes"
            cat "$OUT.sha256"
          } 2>&1 | tee ci-logs/apk.txt || true

      - uses: actions/upload-artifact@v4
        with:
          name: KR-Climax-Scramble-${{ steps.pins.outputs.version }}-apk
          path: dist/*
          retention-days: 30

      - name: Publish GitHub Release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.pins.outputs.tag }}"
          {
            echo "KR Climax Scramble ${{ steps.pins.outputs.version }} (arm64-v8a)"
            echo
            echo "Core: Eden ${{ steps.pins.outputs.eden_ref }} (${{ steps.pins.outputs.eden_commit }})"
            echo "Commit: ${{ github.sha }} · Build #${{ github.run_number }}"
            echo
            echo "Turnip bundled:"
            cat eden/src/android/app/src/main/assets/kr_drivers/SOURCE.txt 2>/dev/null || echo "(none — system driver)"
            echo
            echo "Cara pasang: lihat docs/INSTALL.md di repositori."
          } > notes.md
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
            gh release edit "$TAG" --notes-file notes.md
          else
            gh release create "$TAG" dist/* --title "KR Climax Scramble $TAG" --notes-file notes.md
          fi

      # The CI log blobs are not reachable from every tool, so a compact copy of the
      # logs is pushed to the orphan branch "ci-logs" (one folder per run).
      - name: Publish CI logs
        if: always()
        run: |
          mkdir -p ci-logs
          cd ci-logs
          for f in *.log; do
            [ -f "$f" ] || continue
            grep -nE "error:|e: |FAILED|FAILURE|What went wrong|Exception|\berror\b" "$f" | head -400 > "${f%.log}.errors.txt" || true
            tail -n 400 "$f" > "${f%.log}.tail.txt"
            rm -f "$f"
          done
          echo "run ${{ github.run_id }} sha ${{ github.sha }} job ${{ job.status }}" > summary.txt
          cd ..
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          git fetch -q origin ci-logs:ci-logs 2>/dev/null || true
          git worktree add -q ../logs-wt ci-logs 2>/dev/null || { git worktree add -q --detach ../logs-wt && (cd ../logs-wt && git checkout -q --orphan ci-logs && git rm -rfq . || true); }
          rm -rf "../logs-wt/run-${{ github.run_number }}"
          cp -r ci-logs "../logs-wt/run-${{ github.run_number }}"
          cd ../logs-wt
          git add -A
          git commit -qm "logs run ${{ github.run_number }} (${{ job.status }})" || true
          git push -q origin ci-logs || true
